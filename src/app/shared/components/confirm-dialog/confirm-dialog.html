<dialog
  #dialog
  class="m-auto w-[min(28rem,calc(100%-2rem))] rounded-xl bg-base-100 p-6 text-base-content shadow-xl backdrop:bg-black/50"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="messageId"
  (cancel)="cancel($event)"
>
  <h2 [id]="titleId" class="text-xl font-semibold">{{ title() }}</h2>
  <p [id]="messageId" class="mt-3">{{ message() }}</p>
  @if (error()) {
    <app-alert class="mt-3" type="error" [message]="error()" />
  }
  <div class="mt-6 flex flex-wrap justify-end gap-3">
    <button
      appButton
      type="button"
      color="neutral"
      variant="soft"
      [disabled]="busy()"
      (click)="cancel()"
      autofocus
    >
      {{ cancelLabel() }}
    </button>
    <button appButton type="button" color="error" [disabled]="busy()" (click)="confirmed.emit()">
      {{ confirmLabel() }}
    </button>
  </div>
</dialog>
