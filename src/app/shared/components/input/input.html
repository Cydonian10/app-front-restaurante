<label class="block text-xs font-semibold text-base-content" [attr.for]="id() || null"
  >{{ label() }}
  @if (required()) {
    <span class="text-secondary" aria-hidden="true">*</span>
  }
</label>
<div class="relative mt-2">
  <input
    class="w-full rounded-xl bg-base-300 px-4 py-2.5 text-sm text-base-content outline-2 outline-transparent placeholder:text-base-content/55 focus-visible:outline-primary disabled:opacity-50"
    [class.pr-12]="type() === 'password'"
    [id]="id() || null"
    [type]="type() === 'password' && showPassword() ? 'text' : type()"
    [attr.name]="name() || null"
    [attr.autocomplete]="autocomplete() || null"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.aria-invalid]="displayedError() ? 'true' : null"
    [attr.aria-describedby]="displayedError() ? id() + '-error' : null"
    (input)="value.set($any($event.target).value)"
    (blur)="touch.emit()"
  />
  @if (type() === 'password') {
    <button
      type="button"
      class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-xl text-base-content/65 hover:text-base-content focus-visible:outline-2 focus-visible:outline-primary"
      [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      [attr.aria-pressed]="showPassword()"
      (click)="showPassword.set(!showPassword())"
    >
      @if (showPassword()) {
        <svg lucideEyeOff class="size-4" aria-hidden="true"></svg>
      } @else {
        <svg lucideEye class="size-4" aria-hidden="true"></svg>
      }
    </button>
  }
</div>
@if (displayedError()) {
  <p [id]="id() + '-error'" class="mt-1 origin-top text-xs text-error" role="alert"
    animate.enter="animate-[field-error-in_180ms_ease-out] motion-reduce:animate-none"
    animate.leave="animate-[field-error-out_150ms_ease-in_forwards] motion-reduce:animate-none">{{ displayedError() }}</p>
} @else if (hint()) {
  <p class="mt-1 text-sm text-base-content/70">{{ hint() }}</p>
}
